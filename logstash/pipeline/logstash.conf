input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  if [tags] and "_jsonparsefailure" in [tags] {
    drop { }
  }
  
  if [message] {
    # Primero intentamos parsear el mensaje como JSON
    json {
      source => "message"
      target => "log_data"
      tag_on_failure => ["_json_parse_failure"]
    }
  }
  
  # Si el mensaje contiene JSON escapado, lo procesamos
  if [message] and "_json_parse_failure" in [tags] {
    # Removemos el tag de fallo para intentar de nuevo
    mutate {
      remove_tag => ["_json_parse_failure"]
    }
    
    # Usamos grok para extraer el JSON del mensaje
    grok {
      match => { "message" => '^%{GREEDYDATA:json_content}$' }
    }
    
    # Parseamos el JSON extraído
    if [json_content] {
      json {
        source => "json_content"
        target => "log_data"
      }
    }
  }
  
  # Limpiamos campos innecesarios
  if [log_data] {
    mutate {
      remove_field => ["json_content"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "simulacion-inventario-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}
